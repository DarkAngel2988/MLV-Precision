name: Compilar MLV Precision
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Instalar Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Probar geometría y compilar APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Verificar firma y estructura del APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          "$SDK/apksigner" verify --verbose --print-certs "$APK"
          "$SDK/aapt" dump badging "$APK" | head -n 16
          sha256sum "$APK"
      - name: Instalar en emulador Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.mlv.precision
            adb shell am start -n com.mlv.precision/.MainActivity
            sleep 5
            adb shell pidof com.mlv.precision
      - name: Publicar APK de pruebas
        uses: actions/upload-artifact@v4
        with:
          name: MLV-Precision-v0.1-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
